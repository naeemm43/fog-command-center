name: Catch-Up Deal Sweep

# One-shot deep sweep of historical M&A activity. Manually triggered via
# the Actions tab → "Run workflow", or via the gh CLI:
#   gh workflow run catchup.yml
# Use this when seeding fresh data or when we suspect coverage gaps.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catchup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install staticrypt
        run: npm install -g staticrypt

      - name: Decrypt HTML for in-place splice
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          npx staticrypt --decrypt docs/index.html -p "$SITE_PASSWORD" --short -d docs

      - name: Run catchup sweep
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/catchup.py

      - name: Re-encrypt HTML
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          npx staticrypt docs/index.html \
            -p "$SITE_PASSWORD" \
            --short \
            --template-title "FOG Industry Command Center" \
            --template-instructions "Enter the access password to continue." \
            --template-color-primary "#1F3864" \
            --template-color-secondary "#3498db" \
            --template-button "Access Command Center" \
            --remember 30 \
            -d docs

      - name: Commit and push catchup results
        run: |
          git config user.email "fog-bot@automated.local"
          git config user.name "FOG Command Center Bot"
          git add docs/ data/
          if git diff --cached --quiet; then
            echo "No new deals discovered."
          else
            git commit -m "Catchup sweep: $(date -u +%Y-%m-%d)"
            git push
          fi
